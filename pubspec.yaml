name: echobook
description: "EchoBook — offline-first ebook reader, text-to-speech listening, and audio export."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.7

  # Storage / files
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.3
  desktop_drop: ^0.5.0

  # Ebook parsing
  epubx: ^4.0.0
  syncfusion_flutter_pdfviewer: ^27.2.5
  syncfusion_flutter_pdf: ^27.2.5
  html: ^0.15.5

  # TTS + audio
  flutter_tts: ^4.2.0
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  record: ^6.0.0

  # Permissions / sharing
  permission_handler: ^11.3.1
  share_plus: ^10.1.2

  # Utilities
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  image: ^3.3.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  mocktail: ^1.0.4
  archive: ^3.6.1

flutter:
  uses-material-design: true
